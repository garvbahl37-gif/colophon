<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 282" width="860" height="282"
     role="img" aria-label="Retrieval evaluation: nDCG at 3 for 5 configurations over 23 questions and 40 passages.">
  <style>
    .bg { fill: #ffffff; } .rule { stroke: #0a0a0a; } .hair { stroke: #d0d0d6; }
    .tx { fill: #0a0a0a; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
    .num { fill: #0a0a0a; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; font-weight: 700; }
    .dim { fill: #6b6b73; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 9px; }
    .track { fill: #efeff1; } .bar { fill: #8a8a93; }
    .win { fill: #1f8a56; } .ship { fill: #e8442a; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0c0c0d; } .rule { stroke: #f4f4f5; } .hair { stroke: #3a3a40; }
      .tx { fill: #f4f4f5; } .num { fill: #f4f4f5; } .dim { fill: #8a8a93; }
      .track { fill: #1c1c1f; } .bar { fill: #71717a; } .win { fill: #34d399; }
    }

    /* Bars grow from zero once per cycle, on a shared scale, so the shipped
       configuration visibly falls short of the baseline rather than being drawn
       to look level with it. */
    .grow { transform-origin: 250px 0; animation: grow 6s ease-out infinite; }
    @keyframes grow {
      0% { transform: scaleX(0); } 18% { transform: scaleX(1); }
      92% { transform: scaleX(1); } 100% { transform: scaleX(0); }
    }
    @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
  </style>

  <rect class="bg" width="860" height="282"/>
  <line class="rule" x1="30" y1="26" x2="830" y2="26" stroke-width="2"/>
  <text class="dim" x="30" y="18">RETRIEVAL EVALUATION · nDCG@3 · 23 questions · 40 passages · distractors included</text>

  <text class="dim" x="250" y="62">nDCG@3 (shared scale)</text>
  <text class="dim" x="692" y="62">score</text>
  <text class="dim" x="742" y="62">latency</text>

    <text class="tx" x="30" y="85">vector only</text>
    <rect class="track" x="250" y="74" width="430" height="14"/>
    <rect class="bar grow" x="250" y="74" width="384.4" height="14"/>
    <text class="num" x="692" y="85">0.880</text>
    <text class="dim" x="742" y="85">24ms</text>
    <text class="tx" x="30" y="115">lexical only</text>
    <rect class="track" x="250" y="104" width="430" height="14"/>
    <rect class="bar grow" x="250" y="104" width="389.4" height="14"/>
    <text class="num" x="692" y="115">0.891</text>
    <text class="dim" x="742" y="115">9ms</text>
    <text class="tx" x="30" y="145">hybrid</text>
    <rect class="track" x="250" y="134" width="430" height="14"/>
    <rect class="bar grow" x="250" y="134" width="399.5" height="14"/>
    <text class="num" x="692" y="145">0.914</text>
    <text class="dim" x="742" y="145">8ms</text>
    <text class="tx" x="30" y="175">hybrid + rerank</text>
    <rect class="track" x="250" y="164" width="430" height="14"/>
    <rect class="bar grow" x="250" y="164" width="423" height="14"/>
    <text class="num" x="692" y="175">0.968</text>
    <text class="dim" x="742" y="175">28283ms</text>
    <text class="tx" x="30" y="205">full pipeline</text>
    <rect class="track" x="250" y="194" width="430" height="14"/>
    <rect class="win grow" x="250" y="194" width="430" height="14"/>
    <text class="num" x="692" y="205">0.984</text>
    <text class="dim" x="742" y="205">51043ms</text>

  <line class="hair" x1="30" y1="234" x2="830" y2="234" stroke-width="1"/>
  <text class="dim" x="30" y="252">green = best measured · red = what ships. Regenerated by pnpm eval, so the picture cannot disagree with the numbers.</text>
  <text class="dim" x="30" y="265">A small corpus flatters the baseline; production reranks with a different model. Neither is settled by this run.</text>
</svg>
